name: 🚀 Keystone CI/CD & Quality Gates Pipeline
on:
  push:
    branches: [ develop, qa ]
  pull_request:
    branches: [ develop, qa, main ]

jobs:
  quality-gates:
    name: 🧪 Quality Gates & Gobernanza
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 🛡️ Validación Sintáctica PHP Lint
        run: |
          echo "🔍 Ejecutando php -l sobre archivos modificados..."
          find . -name "*.php" ! -path "./vendor/*" -exec php -l {} +

      - name: 🔢 Verificación de Correlativo SOL-XXXX
        run: |
          echo "🔍 Comprobando registro de correlativo en CONTROL_CORRELATIVOS.md..."
          if ! grep -q "SOL-" CONTROL_CORRELATIVOS.md; then
            echo "❌ ERROR: No se encontró correlativo SOL-XXXX registrado."
            exit 1
          fi
          echo "✅ Correlativo validado."

      - name: 🌐 Consulta Blast Radius al Keystone Gateway
        env:
          KEYSTONE_TOKEN: ${{ secrets.KEYSTONE_DEVELOPER_TOKEN }}
        run: |
          echo "📡 Verificando estado del Gateway Keystone..."
          curl -sI -H "Authorization: Bearer $KEYSTONE_TOKEN" https://gateway.keystoneadvisors.cl/mcp/v1 || true

      - name: 🧠 Sincronización de Aprendizajes de Agentes IA (Active Learning)
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
        env:
          KEYSTONE_TOKEN: ${{ secrets.KEYSTONE_DEVELOPER_TOKEN }}
        run: |
          echo "🔄 Verificando si hay aprendizajes en .agents/ para sincronizar al Gateway central..."
          if git diff --name-only HEAD~1 HEAD | grep -q "^\.agents/"; then
            echo "🚀 Sincronizando lecciones aprendidas al Keystone Gateway..."
            curl -s -X POST https://gateway.keystoneadvisors.cl/mcp/v1 \
              -H "Authorization: Bearer $KEYSTONE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"sync_agent_learnings","arguments":{"agent_id":"dev-php","lesson":"Actualización de reglas desde commit QA","project_key":"SN"}}}' || true
            echo "✅ Aprendizajes sincronizados exitosamente."
          else
            echo "ℹ️ No hay modificaciones en .agents/ en este commit."
          fi
